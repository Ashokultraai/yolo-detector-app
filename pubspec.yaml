name: tri_model_detector
description: Flutter app that detects objects via the detection backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2            # talk to the backend
  image_picker: ^1.1.2   # take photo / pick image
  shared_preferences: ^2.3.2 # remember the backend URL

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
